<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Options & Property{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="{% url 'home' %}" class="text-xl font-bold text-slate-800">Options & Property</a>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="{% url 'home' %}" class="text-slate-600 hover:text-blue-600 font-medium transition">Home</a>
                    <a href="{% url 'options_pricing' %}" class="text-slate-600 hover:text-blue-600 font-medium transition">Options Pricing</a>
                    <a href="{% url 'house_pricing' %}" class="text-slate-600 hover:text-blue-600 font-medium transition">House Pricing</a>
                    <a href="{% url 'sentiment_analysis' %}" class="text-slate-600 hover:text-blue-600 font-medium transition">Sentiment Analysis</a>
                    <a href="{% url 'about' %}" class="text-slate-600 hover:text-blue-600 font-medium transition">About</a>
                </div>
                <div class="md:hidden">
                    <button id="mobile-menu-button" class="text-slate-600 hover:text-slate-800">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <!-- Mobile menu -->
            <div id="mobile-menu" class="hidden md:hidden pb-4">
                <a href="{% url 'home' %}" class="block px-4 py-2 text-slate-600 hover:bg-slate-100">Home</a>
                <a href="{% url 'options_pricing' %}" class="block px-4 py-2 text-slate-600 hover:bg-slate-100">Options Pricing</a>
                <a href="{% url 'house_pricing' %}" class="block px-4 py-2 text-slate-600 hover:bg-slate-100">House Pricing</a>
                <a href="{% url 'sentiment_analysis' %}" class="block px-4 py-2 text-slate-600 hover:bg-slate-100">Sentiment Analysis</a>
                <a href="{% url 'about' %}" class="block px-4 py-2 text-slate-600 hover:bg-slate-100">About</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    {% block content %}
    {% endblock %}

    <script>
        // Mobile menu toggle
        document.getElementById('mobile-menu-button').addEventListener('click', function() {
            var menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
